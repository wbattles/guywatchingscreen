<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>guywatchingscreen</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322211e'/><rect x='6' y='8' width='20' height='13' rx='2.5' fill='none' stroke='%237ea4ff' stroke-width='2.2'/><circle cx='13' cy='14.5' r='1.6' fill='%233fb950'/><circle cx='19' cy='14.5' r='1.6' fill='%233fb950'/><path d='M12 25h8' stroke='%237ea4ff' stroke-width='2.2' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
      try { const t = localStorage.getItem('gws-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#monitors" data-tab="monitors" aria-label="guywatchingscreen home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="6" width="24" height="16" rx="3" class="mark-screen"/>
            <circle cx="12.5" cy="14" r="2" class="mark-eye"/>
            <circle cx="19.5" cy="14" r="2" class="mark-eye"/>
            <path d="M11 27h10" class="mark-stand"/>
          </svg>
          <span class="brand-name">guy<span>watching</span>screen</span>
        </a>

        <nav class="tabs" aria-label="Sections">
          <a href="#monitors" data-tab="monitors" class="tab-link active">Monitors</a>
          <a href="#alerts" data-tab="alerts" class="tab-link">Alert rules</a>
          <a href="#comms" data-tab="comms" class="tab-link">Comms</a>
        </nav>

        <button class="icon-btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" class="icon icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="icon icon-moon" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <!-- monitors tab -->
      <section id="tab-monitors" class="tab">
        <div class="page-head">
          <div>
            <h1>Monitors</h1>
            <p class="subtle" id="refresh-note">Watching your screens.</p>
          </div>
          <div class="page-head-actions">
            <label class="search">
              <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="check-filter" type="search" placeholder="Filter monitors" aria-label="Filter monitors" oninput="renderChecks()">
            </label>
            <button class="btn btn-primary" onclick="showCheckForm()">
              <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Add monitor
            </button>
          </div>
        </div>

        <div class="stats" id="stats-area"></div>

        <div class="monitors-layout">
          <section class="monitors-main">
            <div id="checks-area"><div class="skeleton-list"><div></div><div></div><div></div></div></div>
          </section>

          <aside class="card feed">
            <div class="card-head">
              <h2>Recent alerts</h2>
              <button id="clear-alerts-btn" class="btn btn-ghost btn-sm" onclick="clearAlerts()" hidden>Clear all</button>
            </div>
            <div id="recent-alerts-area"><p class="empty">Loading…</p></div>
          </aside>
        </div>
      </section>

      <!-- alerts tab -->
      <section id="tab-alerts" class="tab" hidden>
        <div class="page-head">
          <div>
            <h1>Alert rules</h1>
            <p class="subtle">Fire when a monitor fails X times within Y minutes.</p>
          </div>
          <div class="page-head-actions">
            <button class="btn btn-primary" onclick="showAlertRuleForm()">
              <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Add rule
            </button>
          </div>
        </div>
        <div id="alert-settings-area"><div class="skeleton-list"><div></div><div></div></div></div>
      </section>

      <!-- comms tab -->
      <section id="tab-comms" class="tab" hidden>
        <div class="page-head">
          <div>
            <h1>Comms</h1>
            <p class="subtle">Where alerts get sent.</p>
          </div>
        </div>
        <section class="card comms-card">
          <div class="card-head"><h2>Webhook</h2><span class="subtle small">from environment</span></div>
          <div id="webhook-setup-area"><p class="empty">Loading…</p></div>
        </section>
      </section>

      <footer class="page-footer">
        <span>guywatchingscreen</span>
        <span class="dot-sep">·</span>
        <a href="https://github.com/wbattles/guywatchingscreen" target="_blank" rel="noreferrer">open source</a>
      </footer>
    </main>

    <div id="flash-area" aria-live="polite"></div>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div id="modal-content"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
