name: guywatchingscreen release

# After each squash merge to main, the commit subject (the PR title) decides the release:
#   fix: -> patch, feat: -> minor, <type>!: or a "BREAKING CHANGE:" footer -> major
#   docs/chore/test/ci/refactor/build/perf -> no release
# Git tags (vX.Y.Z) are the source of truth; the image is versioned from the tag.
# tcz-flux image automation picks up new v* tags and rolls them out.
# Everything runs in this one workflow because tags pushed with GITHUB_TOKEN don't trigger other workflows.
# To release an exact version, run this workflow by hand on main:
#   gh workflow run release.yaml --ref main -f version=2.0.0

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release from the head of main, without the leading v (for example 2.0.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide bump from the squash commit
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          last="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          last="${last:-v0.0.0}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "::error::Run manual releases on main"; exit 1; fi
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::version must be X.Y.Z, got '$REQUESTED'"; exit 1; fi
            highest="$(printf '%s\n%s\n' "${last#v}" "$REQUESTED" | sort -V | tail -1)"
            if [ "$REQUESTED" = "${last#v}" ] || [ "$highest" != "$REQUESTED" ]; then
              echo "::error::version $REQUESTED must be higher than the latest tag $last"; exit 1
            fi
            echo "last=$last manual next=$REQUESTED"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          body="$(git log -1 --format=%b)"
          IFS=. read -r major minor patch <<<"${last#v}"
          if [[ "$subject" =~ ^[a-z]+(\(.+\))?!: ]] || grep -q '^BREAKING CHANGE:' <<<"$body"; then
            if [ "$major" -ge 1 ]; then kind=major; else kind=minor; fi
          elif [[ "$subject" =~ ^feat(\(.+\))?: ]]; then kind=minor
          elif [[ "$subject" =~ ^fix(\(.+\))?: ]]; then kind=patch
          else kind=none; fi
          case "$kind" in
            major) next="$((major+1)).0.0" ;;
            minor) next="$major.$((minor+1)).0" ;;
            patch) next="$major.$minor.$((patch+1))" ;;
            none)  next="" ;;
          esac
          echo "last=$last kind=$kind next=$next subject=$subject"
          if [ -n "$next" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and create GitHub release
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v${{ steps.bump.outputs.version }}"
          git tag "$v" && git push origin "$v"
          gh release create "$v" --generate-notes --title "guywatchingscreen $v"

  image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/guywatchingscreen:v${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/guywatchingscreen:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
